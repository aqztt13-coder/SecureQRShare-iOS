name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet CLI
        run: |
          pip install --upgrade pip
          pip install "flet[all]"

      - name: Build and Package IPA
        run: |
          yes | flet build ipa --project "SecureQRShare" --flutter-build-args="--no-codesign"
          mkdir -p output_ipa
          if ls build/ipa/*.ipa 1> /dev/null 2>&1; then
            cp build/ipa/*.ipa output_ipa/SecureQRShare.ipa
          else
            APP_PATH=$(find build -name "*.app" -type d | head -n 1)
            echo "Found app bundle at: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r output_ipa/SecureQRShare.ipa Payload
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureQRShare-iOS
          path: output_ipa/SecureQRShare.ipa
          if-no-files-found: error
